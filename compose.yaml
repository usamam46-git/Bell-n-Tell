services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bellntell
      POSTGRES_PASSWORD: bellntell_dev_only
      POSTGRES_DB: bellntell
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bellntell -d bellntell"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
